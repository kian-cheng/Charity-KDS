<!DOCTYPE html>
<html>
<head>
    <title>Charity KDS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f7f6; color: #333; }
        .hidden { display: none; }
        .category-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .btn { border: none; padding: 20px 10px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .juice { background: #f39c12; } .smoothie { background: #9b59b6; } .cafe { background: #795548; }
        .mod-btn { background: #ddd; border: none; padding: 10px; border-radius: 20px; margin-right: 5px; cursor: pointer; font-weight: bold; }
        .mod-btn.active { background: #3498db; color: white; }

        /* KITCHEN BOXES */
        #order-list { display: grid; grid-template-columns: repeat(auto-fill, 300px); gap: 20px; justify-content: center; padding: 20px; }
        .card { background: white; width: 300px; min-height: 220px; padding: 15px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; border-top: 15px solid #ccc; }
        .juice-card { border-top-color: #f39c12; } .smoothie-card { border-top-color: #9b59b6; } .cafe-card { border-top-color: #795548; }
        .done-btn { width: 100%; background: #2ecc71; border: none; padding: 15px; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .admin-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <h1 id="view-title">Connecting...</h1>
    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

    <div id="register-view" class="hidden">
        <div class="category-box">
            <h3>Modifiers</h3>
            <button class="mod-btn" onclick="toggleMod('✨ Sparkling', this)">✨ Sparkling</button>
            <button class="mod-btn" onclick="toggleMod('❄️ No Ice', this)">❄️ No Ice</button>
            <input type="text" id="order-note" placeholder="Note..." style="width:100%; margin-top:10px; padding:10px; box-sizing:border-box;">
        </div>
        <div id="menu-build"></div>
        <div class="category-box" style="background:#333; color:white;">
            <h3>📊 Admin</h3>
            <div id="admin-list"></div>
        </div>
    </div>

    <div id="kitchen-view" class="hidden">
        <div id="order-list"></div>
        <div id="recent-completed" style="margin-top:40px; border-top:2px dashed #ccc; padding:20px;">
            <h3 style="color:#777">Recently Completed (Undo)</h3>
            <div id="recent-list"></div>
        </div>
    </div>

    <script>
        const socket = io();
        const path = window.location.pathname;
        const stationType = path.split('/').pop();
        let activeMods = [];
        let completedBuffer = [];

        // 1. SET VIEW
        if (path === '/' || path === '/register' || stationType === "") {
            document.getElementById('view-title').innerText = "Register";
            document.getElementById('register-view').classList.remove('hidden');
        } else {
            document.getElementById('view-title').innerText = stationType.toUpperCase();
            document.getElementById('kitchen-view').classList.remove('hidden');
            socket.emit('request_sync', stationType);
        }

        // 2. REGISTER LOGIC
        function toggleMod(m, btn) {
            if(activeMods.includes(m)) { activeMods = activeMods.filter(i => i !== m); btn.classList.remove('active'); }
            else { activeMods.push(m); btn.classList.add('active'); }
        }

        socket.on('sync_menu', (menu) => {
            const container = document.getElementById('menu-build');
            const admin = document.getElementById('admin-list');
            if(!container) return;
            container.innerHTML = ''; admin.innerHTML = '';

            ['juice', 'smoothie', 'cafe'].forEach(cat => {
                const sec = document.createElement('div');
                sec.className = 'category-box';
                sec.innerHTML = `<h3>${cat.toUpperCase()}</h3><div class="grid" id="grid-${cat}"></div>`;
                container.appendChild(sec);
            });

            for (const [name, info] of Object.entries(menu)) {
                const btn = document.createElement('button');
                btn.className = `btn ${info.category}`;
                btn.innerText = name;
                btn.disabled = !info.available;
                btn.style.opacity = info.available ? "1" : "0.3";
                btn.onclick = () => {
                    const note = [...activeMods, document.getElementById('order-note').value].filter(x => x).join(" | ");
                    socket.emit('new_order', { id: Date.now(), name, category: info.category, note });
                    document.getElementById('order-note').value = "";
                    activeMods = [];
                    document.querySelectorAll('.mod-btn').forEach(b => b.classList.remove('active'));
                };
                document.getElementById(`grid-${info.category}`).appendChild(btn);

                const row = document.createElement('div');
                row.className = "admin-row";
                row.innerHTML = `<span>${name}: <b>${info.tally}</b></span>
                    <div>
                        <button onclick="socket.emit('admin_adjust_tally', {name:'${name}', amount:-1})">-1</button>
                        <button onclick="socket.emit('admin_toggle_stock', '${name}')">${info.available ? 'Sold Out' : 'Restock'}</button>
                    </div>`;
                admin.appendChild(row);
            }
        });

        // 3. KITCHEN LOGIC
        socket.on('display_order', (order) => {
            if (order.category === stationType) {
                const sound = document.getElementById('notif-sound');
                if(sound) { sound.currentTime = 0; sound.play().catch(()=>{}); }

                const list = document.getElementById('order-list');
                const div = document.createElement('div');
                div.className = `card ${order.category}-card`;
                div.id = `order-${order.id}`;
                div.innerHTML = `<div>
                    <button onclick="socket.emit('cancel_order', ${order.id})" style="float:right; border:none; background:none; cursor:pointer;">✖</button>
                    <h2 style="margin:0">${order.name}</h2>
                    <p style="background:#fff9c4; padding:10px; border-radius:5px; font-weight:bold;">${order.note || 'No Note'}</p>
                </div>
                <button class="done-btn" onclick="socket.emit('complete_order', ${order.id})">DONE</button>`;
                list.appendChild(div);
            }
        });

        socket.on('remove_order', (id) => {
            const el = document.getElementById(`order-${id}`);
            if (el) {
                const name = el.querySelector('h2').innerText;
                const note = el.querySelector('p').innerText;
                completedBuffer.unshift({ id, name, note });
                if (completedBuffer.length > 5) completedBuffer.pop();
                updateRecentList();
                el.remove();
            }
        });

        function updateRecentList() {
            const list = document.getElementById('recent-list');
            if(!list) return;
            list.innerHTML = '';
            completedBuffer.forEach(o => {
                const b = document.createElement('button');
                b.style = "padding:10px; margin-right:5px; border-radius:5px; border:1px solid #ccc; background:white; cursor:pointer;";
                b.innerText = `↩️ ${o.name}`;
                b.onclick = () => {
                    socket.emit('new_order', { 
                        id: o.id, 
                        name: o.name, 
                        category: stationType, 
                        note: o.note,
                        isUndo: true
                    });
                    // Remove it from the local undo list
                    completedBuffer = completedBuffer.filter(x => x.id !== o.id);
                    updateRecentList();
                };
                list.appendChild(b);
            });
        }
    </script>
</body>
</html>
